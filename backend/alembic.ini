[alembic]
script_location = migrations
prepend_sys_path = .
# 버전 파일명: 0001_initial.py 처럼 순번이 앞에 오게 한다 (시간순 파악이 쉽다)
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url 은 env.py 가 DATABASE_URL 환경변수에서 읽는다 — 여기 적지 않는다

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
