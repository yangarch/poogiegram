# VA-API 하드웨어 가속 오버레이 (§6.4)
#
# /dev/dri 가 있는 리눅스 호스트에서만 사용한다. 맥에서는 이 파일 없이 기동한다.
#   docker compose -f docker-compose.yml -f docker-compose.vaapi.yml up -d
#   (Makefile 의 `make up` 이 /dev/dri 존재 여부로 자동 선택한다)
#
# group_add 가 빠지면 컨테이너 안에서만 Permission denied 가 나고 호스트에서는
# 정상 동작해서 원인을 찾기 어렵다. renderD128 이 root:render 660 이기 때문이다.

services:
  worker:
    devices:
      - /dev/dri:/dev/dri
    # compose 는 group_add 리스트를 '병합'하므로 베이스의 POOGIEGRAM_GID 에 이어 붙는다.
    #
    # RENDER_GID 와 POOGIEGRAM_GID 가 같은 값이면 중복 항목이 되어 compose 가
    # 설정 검증에서 거부한다. 두 그룹이 실제로 같을 수는 없지만, 값이 잘못
    # 입력되면 원인을 짐작하기 어려운 오류로 나타난다.
    # RENDER_GID_ENTRY 로 한 번 감싸 그 경우 빈 값(=항목 없음)이 되게 한다.
    group_add:
      - "${RENDER_GID:?.env 에 RENDER_GID 를 설정하세요. getent group render | cut -d: -f3}"
